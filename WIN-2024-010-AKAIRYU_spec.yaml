scenario_ref: "WIN-2024-010-AKAIRYU"
source_level: "full_report"

# Operation AkaiRyu / MirrorFace (C0060). Espionage (confidentiality exfil), no destruction.
# Two endpoints, each independently spearphished — no A<->B pivot, no named DC. Shared chain:
#   attacker mail (link) -> user opens .docx.lnk -> trusted-app DLL side-load (ANEL, in-memory)
#   -> WMI/wlrmdr/explorer proxy exec -> MSBuild compiles injector -> HiddenFace persistence
#   -> Windows Sandbox AsyncRAT (Tor+DGA) -> opsec -> C2 egress.
# machine_a objective: export Chrome browser data (dummy PII). machine_b objective: AD recon via
#   csvde/Rubeus against a directory service (deeper access only SOUGHT, no pivot landing). Zero CVE.

