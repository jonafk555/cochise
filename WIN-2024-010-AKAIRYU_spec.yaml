  - id: "internet"
    label: "internet"
    freedom: "fixed"
    note: "Attacker infrastructure: mail sender + cloud staging (attacker_email) and C2 (attacker_c2)."
  - id: "corp_internal"
    label: "corp_internal"
    freedom: "fixed"
    note: "Two victim endpoints (machine_a, machine_b) plus the unspecified directory-service support node (dir_svc). No internal sub-segmentation, no A<->B pivot, no named DC. Reachability fixed; concrete IPs free."

