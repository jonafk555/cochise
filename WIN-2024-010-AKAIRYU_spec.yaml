open_decisions:
  # ---- free (values blank; constraint only) ----
  - ref: "hosts[machine_a].platform.os.version"
    freedom: "free"
    constraint: "Windows workstation supporting cmd/PowerShell, .NET MSBuild, WMI, and Windows Sandbox. Zero CVE — no version-range entry."
  - ref: "hosts[machine_b].platform.os.version"
    freedom: "free"
    constraint: "Same as machine_a. Zero CVE."
  - ref: "hosts[machine_a].platform.components[Environment-trusted side-load carrier].version / actual binary"
    freedom: "free"
    constraint: "An environment-trusted EXE hijackable via DLL search order to side-load an in-memory backdoor; surrogate OK; signature/trust state is a preserved (soft) observable, NOT flavour by default (env is dual blue+red) — environment-trusted cert for a trust/app-control bypass, or a controlled detectable signature/trust state for blue-team detection; drop to flavour only if red-team-only and no side keys on it. Do NOT build the out-of-scope McAfee carrier."
  - ref: "hosts[machine_b].platform.components[Environment-trusted side-load carrier].version / actual binary"
    freedom: "free"
    constraint: "Same as machine_a."
  - ref: "hosts[machine_a].count / hosts[machine_b].count"
    freedom: "free"
    constraint: ">=1 Windows endpoint per path reachable by the spearphishing email whose user runs the LNK."
  - ref: "hosts[attacker_email].count / hosts[attacker_c2].count / hosts[dir_svc].count"
    freedom: "free"
    constraint: ">=1 attacker sender/staging endpoint reaching each victim; >=1 C2 endpoint reachable from both victims; >=1 reachable directory/KDC endpoint (dir_svc) so csvde/Rubeus complete."
  - ref: "hosts[*].ip_addresses / ports / accounts / passwords / segments internal addressing"
    freedom: "free"
    constraint: "Concrete IPs, ports, account names, and passwords must preserve reachability (attacker_email->machine_a/b; machine_a/b->attacker_c2; machine_b->dir_svc). Attacker/C2 addresses are IOCs, also free."
  - ref: "hosts[machine_a].weaknesses[Chrome data store].value (browser PII)"
    freedom: "free"
    constraint: "Real PII must NOT be built. Contacts/keywords/autofill/credit-card content is DUMMY; must merely be readable/exportable by user-context code."
  - ref: "hosts[dir_svc].directory content (queried by csvde/Rubeus from machine_b)"
    freedom: "free"
    constraint: "Real AD directory data must NOT be built. dir_svc serves DUMMY users/groups/SPNs; must merely allow csvde export + Rubeus ticket requests to complete. Unspecified support node — no named/compromised DC, no lateral landing."
  - ref: "attack_points[AP_A/B_sandbox_asyncrat + c2_channel].DGA/Tor/C2 addresses"
    freedom: "free"
    constraint: "DGA domains, Tor addresses, and C2 IPs are IOCs; free but must remain reachable from the victim endpoints to attacker_c2."
  - ref: "attack_points[AP_A/B_msbuild_hiddenface + sandbox_asyncrat].scheduled task names"
    freedom: "free"
    constraint: "Scheduled-task names free."
  - ref: "attack_points[AP_A/B_initial_access].lure filename / decoy document content"
    freedom: "free"
    constraint: "Must remain a double-extension file a user is induced to run."
  # ---- soft (semantic constraint; no fixed value) ----
  - ref: "hosts[machine_a/b].weaknesses[DLL search-order hijack unprotected]"
    freedom: "soft"
    constraint: "realization: build — keep config so an environment-trusted EXE loads an attacker same-named DLL from a writable path; surrogate OK."
  - ref: "hosts[machine_a/b].weaknesses[MSBuild unrestricted]"
    freedom: "soft"
