    action:
      desc: "User opens the LNK, triggering cmd.exe -> PowerShell."
      freedom: "fixed"
      realization: "simulated"
      constraint: "Must yield user-context code exec without shipping a real LNK/VBA payload — see safety_substitutions."
    effect:
      desc: "User-context command execution (cmd/PowerShell) on machine_a."
      freedom: "fixed"
      realization: "given"
      constraint: "Attackable code-exec state feeding AP_A_dll_sideload."
    objective_marker: ""
    provenance_note: ""
