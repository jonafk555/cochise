    host_ref: "machine_a"
    role: "gating"
    surface:
      desc: "An environment-trusted application on machine_a that resolves a same-named DLL from a writable path."
      freedom: "fixed"
      realization: "build"
      constraint: "Exact carrier/version free; surrogate OK."
    weakness:
      desc: "DLL search-order hijack: trusted EXE loads attacker DLL (ANELLDR), side-loading the ANEL backdoor into memory (T1574.001)."
      freedom: "soft"
      realization: "build"
      constraint: "An environment-trusted EXE loads an attacker same-named DLL from a writable path; surrogate OK."
    precondition:
      desc: "User-context code exec on machine_a."
      freedom: "fixed"
      realization: "given"
      constraint: "Provided by AP_A_initial_access effect."
    action:
      desc: "Drop the malicious same-named DLL + trusted carrier; run the carrier to load the in-memory backdoor (capability only)."
      freedom: "fixed"
      realization: "given"
      constraint: "In-memory backdoor capability — see safety_substitutions."
    effect:
      desc: "In-memory backdoor code execution (ANEL-class) on machine_a."
      freedom: "fixed"
      realization: "given"
